[package]
name = "rex-mdpeek"
version = "0.2.0"
edition = "2024"
rust-version = "1.92"
description = "Cross-platform Markdown & Pele SVG diagram viewer for Rex using Ghostty Kitty Graphics Protocol"
license = "MIT"
repository = "https://github.com/verte21/rex-mdpeek"
readme = "README.md"
keywords = ["rex", "markdown", "mermaid", "pele", "kitty-graphics"]
categories = ["command-line-utilities", "visualization"]

[dependencies]
anyhow = "1"
base64 = "0.22"
crossterm = "0.28"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
resvg = "0.45"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"
